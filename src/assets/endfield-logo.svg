  </g>

  <!-- Title Text -->
  <text x="135" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFE600" letter-spacing="6">
